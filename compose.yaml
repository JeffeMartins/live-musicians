name: live-musicians
services:
  api:
    build: ./backend
    ports: ["127.0.0.1:3333:3333"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/developers
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mongo-data:
